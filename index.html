<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>微信表情包画廊</title>
<style>
  :root { --green:#07C160; --green-dark:#06AD56; --bg:#f5f6f7; --card:#fff; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif; background:var(--bg); color:#1f2329; }
  header { background:var(--green); color:#fff; padding:16px 20px; position:sticky; top:0; z-index:10; box-shadow:0 2px 6px rgba(0,0,0,.12); }
  header h1 { margin:0; font-size:20px; }
  header p { margin:4px 0 0; font-size:13px; opacity:.92; }
  .toolbar { max-width:1100px; margin:16px auto 0; padding:0 16px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  #search { flex:1; min-width:200px; padding:9px 12px; border:1px solid #d0d3d6; border-radius:8px; font-size:14px; }
  .hint { max-width:1100px; margin:8px auto 0; padding:0 16px; font-size:13px; color:#6b7280; }
  .grid { max-width:1100px; margin:16px auto 40px; padding:0 16px; display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px; }
  .card { background:var(--card); border-radius:10px; overflow:hidden; box-shadow:0 1px 4px rgba(0,0,0,.08); display:flex; flex-direction:column; }
  .card .thumb { position:relative; height:130px; display:flex; align-items:center; justify-content:center; background:#fafafa; cursor:pointer; }
  .card .thumb img { max-width:100%; max-height:130px; object-fit:contain; }
  .card .foot { display:flex; border-top:1px solid #eee; }
  .card .foot button { flex:1; padding:8px 0; border:0; background:#fff; font-size:13px; cursor:pointer; color:#374151; }
  .card .foot button:hover { background:#f0f9f4; color:var(--green-dark); }
  .card .badge { position:absolute; top:6px; right:6px; background:#ffb300; color:#fff; font-size:11px; padding:2px 6px; border-radius:6px; }
  .empty { text-align:center; color:#9aa0a6; padding:40px 16px; font-size:14px; line-height:1.8; }
  .toast { position:fixed; left:50%; bottom:28px; transform:translateX(-50%); background:rgba(0,0,0,.8); color:#fff; padding:10px 16px; border-radius:8px; font-size:14px; opacity:0; pointer-events:none; transition:opacity .2s; z-index:99; }
  .toast.show { opacity:1; }
</style>
</head>
<body>
<header>
  <h1>微信表情包画廊</h1>
  <p>点击表情复制图片，去 Teams 聊天 Ctrl+V 粘贴；动图(gif)点“下载”后拖入 Teams 保留动画</p>
</header>
<div class="toolbar">
  <input id="search" type="search" placeholder="搜索表情文件名…">
</div>
<div class="hint" id="count"></div>
<div class="grid" id="grid"></div>
<div class="empty" id="empty" style="display:none">
  还没有表情包。<br>把表情图片上传到 GitHub 仓库的 <code>emoji/</code> 文件夹即可，<br>页面会自动读取（无需再手动生成列表）。
</div>
<div class="toast" id="toast"></div>
<script>
let emojis = [];
let toastTimer = null;
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),2600); }

const REPO_API = 'https://api.github.com/repos/Flonerze/wechat-emoji-teams-tab/contents/emoji';
function isImage(n){ n = n.toLowerCase(); return n.endsWith('.gif')||n.endsWith('.png')||n.endsWith('.jpg')||n.endsWith('.jpeg')||n.endsWith('.webp')||n.endsWith('.bmp'); }
const CACHE_KEY = 'emojiListCache';
const CACHE_TTL = 5 * 60 * 1000;

function readCache(){
  try{
    const c = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
    if(c && c.list && (Date.now() - c.t) < CACHE_TTL) return c.list;
  }catch(e){}
  return null;
}
function writeCache(list){
  try{ localStorage.setItem(CACHE_KEY, JSON.stringify({list:list, t:Date.now()})); }catch(e){}
}
async function fetchListFromApi(){
  const resp = await fetch(REPO_API, { headers: { 'Accept': 'application/vnd.github+json' } });
  if(!resp.ok) throw new Error('api ' + resp.status);
  const data = await resp.json();
  if(!Array.isArray(data)) throw new Error('not array');
  return data.filter(it => it.type === 'file' && isImage(it.name)).map(it => it.name).sort();
}
async function fetchListFromJson(){
  const r = await fetch('emoji.json?t=' + Date.now());
  const d = await r.json();
  return (d.emojis || []).sort();
}
async function load(){
  const cached = readCache();
  if(cached){ emojis = cached; render(); }
  try{
    emojis = await fetchListFromApi();
    writeCache(emojis);
    render();
  }catch(e){
    try{
      emojis = await fetchListFromJson();
      writeCache(emojis);
      render();
    }catch(e2){
      if(emojis.length === 0){ emojis = []; render(); }
      toast('加载表情列表失败，请稍后刷新');
    }
  }
}
function render(){
  const grid = document.getElementById('grid');
  const empty = document.getElementById('empty');
  const count = document.getElementById('count');
  const q = document.getElementById('search').value.trim().toLowerCase();
  const list = q ? emojis.filter(f => f.toLowerCase().includes(q)) : emojis;
  count.textContent = `共 ${emojis.length} 个表情${q ? '，筛选出 '+list.length+' 个' : ''}`;
  empty.style.display = emojis.length===0 ? '' : 'none';
  grid.innerHTML = '';
  if(list.length===0 && emojis.length>0){
    const d=document.createElement('div'); d.className='empty'; d.textContent='没有匹配的表情'; grid.appendChild(d); return;
  }
  for(const f of list){
    const card = document.createElement('div'); card.className='card';
    const thumb = document.createElement('div'); thumb.className='thumb'; thumb.title=f;
    const img = document.createElement('img'); img.src='emoji/'+encodeURIComponent(f); img.alt=f; img.loading='lazy';
    img.onerror = ()=>{ img.style.display='none'; };
    thumb.appendChild(img);
    if(f.toLowerCase().endsWith('.gif')){
      const b = document.createElement('span'); b.className='badge'; b.textContent='动图';
      thumb.appendChild(b);
    }
    thumb.onclick = ()=>copyImage(f);
    const foot = document.createElement('div'); foot.className='foot';
    const bCopy = document.createElement('button'); bCopy.textContent='复制'; bCopy.onclick=(e)=>{e.stopPropagation(); copyImage(f);};
    const bDl = document.createElement('button'); bDl.textContent='下载'; bDl.onclick=(e)=>{e.stopPropagation(); download(f);};
    foot.appendChild(bCopy); foot.appendChild(bDl);
    card.appendChild(thumb); card.appendChild(foot);
    grid.appendChild(card);
  }
}
async function copyImage(file){
  const url = 'emoji/' + encodeURIComponent(file);
  try{
    const resp = await fetch(url);
    const blob = await resp.blob();
    if(file.toLowerCase().endsWith('.gif')){
      try{
        await navigator.clipboard.write([new ClipboardItem({'image/gif': blob})]);
        toast('已复制动图（若在 Teams 里不动，请点“下载”后拖入）');
        return;
      }catch(e){ /* 继续按 PNG 处理 */ }
    }
    const png = await preparePng(blob);
    await navigator.clipboard.write([new ClipboardItem({'image/png': png})]);
    toast('已复制，去 Teams 聊天按 Ctrl+V 粘贴');
  }catch(e){
    try{
      const resp = await fetch(url);
      const blob = await resp.blob();
      const png = await preparePng(blob);
      await navigator.clipboard.write([new ClipboardItem({'image/png': png})]);
      toast('已复制(图片)，去 Teams 粘贴');
    }catch(e2){
      toast('复制失败，请点“下载”保存后再拖到 Teams');
    }
  }
}
function preparePng(blob){
  return new Promise((resolve,reject)=>{
    const url = URL.createObjectURL(blob);
    const im = new Image();
    im.onload = ()=>{
      try{
        const MAX = 400;
        const w = im.naturalWidth, h = im.naturalHeight;
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        const ctx = c.getContext('2d', { willReadFrequently: true });
        ctx.drawImage(im, 0, 0);
        // 裁掉四周透明边（去掉灰色大圈）
        const imgData = ctx.getImageData(0, 0, w, h);
        const d = imgData.data;
        let minX = w, minY = h, maxX = -1, maxY = -1;
        for(let y=0; y<h; y++){
          for(let x=0; x<w; x++){
            if(d[(y*w + x)*4 + 3] > 8){
              if(x<minX) minX=x;
              if(x>maxX) maxX=x;
              if(y<minY) minY=y;
              if(y>maxY) maxY=y;
            }
          }
        }
        let tw = w, th = h, sx = 0, sy = 0;
        if(maxX >= minX && maxY >= minY){
          sx = minX; sy = minY; tw = maxX - minX + 1; th = maxY - minY + 1;
        }
        const c2 = document.createElement('canvas');
        c2.width = tw; c2.height = th;
        c2.getContext('2d').drawImage(c, sx, sy, tw, th, 0, 0, tw, th);
        // 限制最大尺寸，避免小图发送后过大
        const scale = Math.min(1, MAX / Math.max(tw, th));
        if(scale < 1){
          const fw = Math.round(tw*scale), fh = Math.round(th*scale);
          const c3 = document.createElement('canvas');
          c3.width = fw; c3.height = fh;
          c3.getContext('2d').drawImage(c2, 0, 0, fw, fh);
          c3.toBlob(b => b?resolve(b):reject(new Error('toBlob failed')), 'image/png');
        }else{
          c2.toBlob(b => b?resolve(b):reject(new Error('toBlob failed')), 'image/png');
        }
      }catch(err){ reject(err); }
      finally{ URL.revokeObjectURL(url); }
    };
    im.onerror = ()=>{ URL.revokeObjectURL(url); reject(new Error('img load failed')); };
    im.src = url;
  });
}
function download(file){
  const a = document.createElement('a');
  a.href = 'emoji/' + encodeURIComponent(file);
  a.download = file;
  document.body.appendChild(a); a.click(); a.remove();
}
document.getElementById('search').addEventListener('input', render);
load();
</script>
</body>
</html>
